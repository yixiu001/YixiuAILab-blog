# --------------------------------------------------
# 一休定制主题 · 配置（外观与文案）
# --------------------------------------------------
# ⚠️ 所有对外地址、接口与待替换占位（评论/登录 API、YouTube、Telegram、GitHub、
#    打赏收款码图片）统一在站点根 _config.yml 的 services 段配置；
#    本文件不再保存任何地址或图片路径，模板通过 scripts/services.js 读取。

# 站点 Logo
# brand_logo：品牌标识（六边形 AI 实验室徽章），用于顶栏/页脚品牌位
# logo_image：主讲人头像，用于关于/课程/文章/打赏的讲师身份位
logo: 一休AI实验室
brand_logo: /images/logo.png
logo_image: /images/avatar.jpg

# 顶部导航
# 导航：match 为高亮匹配路径前缀（当前页命中任一前缀即高亮）
# 首页用 "/" 精确匹配本身；文章详情归到「文章」，工具详情归到「资源」
nav:
  - { text: 首页, url: /, match: [/] }
  - { text: 课程, url: /courses/, match: [/courses/] }
  - { text: 文章, url: /archives/, match: [/archives/, /posts/, /categories/, /tags/] }
  - { text: 资源, url: /resources/, match: [/resources/, /tools/] }
  - { text: 关于, url: /about/, match: [/about/] }

# 订阅按钮文案；按钮链接取自 _config.yml 的 services.youtube.url
subscribe_text: 订阅频道

# --------------------------------------------------
# 首页 v2：课程 + 文章知识门户（不含 YouTube 视频内容）
# 说明：统计数字（课程节数/文章数/章节数）由首页模板从站点内容实时计算，不写死。
#       视频讲义已并入文章板块（/archives/），用「视频」标签区分，不再有独立视频页。
# --------------------------------------------------
v2:
  hero:
    badge: AI 实战 · 图文讲义 · 持续更新
    title: 把 AI 工具，变成你的生产力
    subtitle: 你好，我是一休。这里沉淀我的体系化课程与图文教程——从环境搭建到实战落地，每一步都有可查阅的讲义。
    primary_btn: { text: 开始学习课程, url: /courses/ }
    secondary_btn: { text: 浏览文章, url: /archives/ }
  course:  # 仅当 courses.yml 为空时兜底，日常课程信息请改 source/_data/courses.yml
    tag: 精选课程
    title: 从零打造 AI 应用 · 完整实战课
    desc: 一门把 AI 工具串起来的体系化课程。从环境准备、模型接入到知识库、工作流与部署发布，12 节带你做出自己的第一个 AI 应用。每节配图文讲义，随时回看。
    hours: 4.5
    level: 入门到实战
    highlights:
      - 大模型 API 申请与费用控制
      - Cherry Studio 本地部署与模型接入
      - 知识库、工作流与多模态实战
      - 打包部署与结业项目

# --------------------------------------------------
# 博主订阅区
# --------------------------------------------------
creator:
  avatar_text: 休
  name: 一休AI实验室 · 科技分享博主
  desc: 专注 AI 工具、免费资源与效率技巧。把体系化课程和教程沉淀成图文，方便你随时查阅、随时落地。
  btn_text: 订阅频道
  # 渠道按钮的名称 / 图标 / 顺序在 _config.yml 的 services.channels 配置，
  # 链接取 services.youtube / telegram / github 的 url

# --------------------------------------------------
# 评论区（文章页 + 课程章节页）
# 开关、provider、各服务参数与接口地址已统一迁到站点根 _config.yml 的
# services.comments / services.api 段，本文件不再保存评论配置。
# 静态站点无后端，未配置接口时页面显示「待接入」，不伪造评论。
# Workers + D1 模板见项目根目录 cloudflare/comments/。
# --------------------------------------------------

# --------------------------------------------------
# 全站 GitHub 登录（导航头像 + 评论区身份）
# 开关在 _config.yml 的 services.auth，接口地址在 services.api。
# OAuth 凭证通过 Worker Secret 设置，不写进任何配置文件：
#   .\cf.ps1 secret put GITHUB_CLIENT_ID
#   .\cf.ps1 secret put GITHUB_CLIENT_SECRET
# --------------------------------------------------

# 页脚
footer:
  note: 分享好工具，让知识免费流动
  powered: Powered by Hexo

# --------------------------------------------------
# 课程兼容配置：已由 source/_data/courses.yml 取代，仅作旧数据兜底
# 新增/修改课程请编辑 source/_data/courses.yml（多课程单一数据源）
# --------------------------------------------------
course:
  id: ai-app
  title: 从零打造 AI 应用：完整实战课程
  total: 12
  channels: ''
