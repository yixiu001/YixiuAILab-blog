# --------------------------------------------------
# 工具导航数据源（资源页 /resources/ 单一数据源）
# 结构：groups[] -> { name, icon, desc, items[] }
#       items[] -> { id, name, url, icon, desc, detail, tags[], featured(可选) }
# 说明：id 用于生成工具详情页 /tools/<id>/，英文小写+连字符，务必唯一。
#       detail 是详情页正文简介。新增工具只需在这里加一条：
#       导航页与详情页都会自动生成，无需改模板。
# --------------------------------------------------

groups:
