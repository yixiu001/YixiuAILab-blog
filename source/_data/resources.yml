friends:
  intro: "认识的同好博客和频道，欢迎互相串门。"
  apply_note: "想交换友链的话，欢迎通过频道私信我，附上以下信息，我会尽快加上："
  requirements:
    - 站点名称与简介
    - 站点地址
    - 头像或 Logo（可选）
  links: []
